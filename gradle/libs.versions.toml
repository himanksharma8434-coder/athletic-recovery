navigationCompose = "2.8.5"
roomRuntime = "2.6.1"
healthConnectClient = "1.1.0-alpha12"
workRuntimeKtx = "2.10.0"
glance = "1.1.1"
glanceAppwidget = "1.1.1"
datastorePreferences = "1.1.2"
